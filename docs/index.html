<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLB Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f8f8f6;--bg3:#f2f2ee;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.16);
  --ink:#111;--ink2:#444;--ink3:#777;--ink4:#aaa;
  --green:#0a7c3e;--green-bg:#ecfdf3;--green-border:#bbf7d0;
  --amber:#92600a;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --blue:#1a56db;--blue-bg:#eff4ff;--blue-border:#bfdbfe;
  --red:#be1b1b;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5}

/* ─ Lock ─ */
#lock{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:2000}
.lock-logo{display:flex;align-items:center;gap:10px}
.lock-logo-icon{width:36px;height:36px;border:1.5px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:1px}
.lock-logo-text{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.lock-logo-sub{font-size:10px;letter-spacing:2px;color:var(--ink3);font-weight:400}
.lock-form{width:240px;display:flex;flex-direction:column;gap:8px}
.lock-input{width:100%;border:1px solid var(--border2);background:#fff;font-family:var(--mono);font-size:13px;padding:9px 12px;outline:none;border-radius:4px;letter-spacing:2px;text-align:center;color:var(--ink)}
.lock-input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,0.06)}
.lock-btn{background:var(--ink);color:#fff;border:none;font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:10px;cursor:pointer;border-radius:4px}
.lock-btn:hover{background:#333}
.lock-err{height:14px;font-size:10px;color:var(--red);text-align:center}
.lock-hint{font-size:10px;color:var(--ink4);text-align:center}

/* ─ App ─ */
#app{display:none;flex-direction:column;min-height:100vh}
#app.on{display:flex}

/* ─ Header ─ */
header{border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:100;flex-shrink:0}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-logo-box{width:28px;height:28px;border:1.5px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.5px}
.hdr-logo-name{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.hdr-tabs{display:flex;gap:2px}
.tab{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink3);border-radius:4px}
.tab:hover{color:var(--ink);background:var(--bg2)}
.tab.on{color:var(--ink);background:var(--bg3);border-color:var(--border2)}
.hdr-right{display:flex;align-items:center;gap:10px}
.live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.upd-time{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.btn-refresh{font-family:var(--mono);font-size:10px;padding:5px 10px;background:#fff;border:1px solid var(--border2);color:var(--ink3);cursor:pointer;border-radius:4px}
.btn-refresh:hover{border-color:var(--ink);color:var(--ink)}

/* ─ Stats bar ─ */
.stats-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:36px;display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.stats-bar::-webkit-scrollbar{display:none}
.stat{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid var(--border);height:100%;white-space:nowrap;flex-shrink:0}
.stat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3)}
.stat-val{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.stat-sub{font-family:var(--mono);font-size:9px;color:var(--ink4)}

/* ─ Main ─ */
main{flex:1}
.view{display:none}
.view.on{display:block}

/* ─ Filter bar ─ */
.fbar{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid var(--border);background:#fff;flex-wrap:wrap}
.flbl{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4)}
.fbtn{font-family:var(--mono);font-size:10px;letter-spacing:0.5px;padding:4px 10px;background:#fff;border:1px solid var(--border2);color:var(--ink3);cursor:pointer;border-radius:4px}
.fbtn:hover{border-color:var(--ink2);color:var(--ink2)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fsep{width:1px;height:16px;background:var(--border2);margin:0 4px}

/* ─ Bet table ─ */
.tbl-wrap{overflow-x:auto}
.tbl-head{display:grid;grid-template-columns:12px 1fr 38px 90px 64px 64px 70px 70px 80px;gap:0;padding:7px 20px;background:var(--bg3);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:50;min-width:560px}
.th{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);padding:0 4px}
.sec-hd{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.sec-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3)}
.badge{font-family:var(--mono);font-size:9px;font-weight:500;padding:2px 7px;border-radius:3px}
.badge-strong{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-moderate{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-slight{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.badge-none{background:var(--bg3);color:var(--ink3);border:1px solid var(--border2)}

.bet-row{display:grid;grid-template-columns:12px 1fr 38px 90px 64px 64px 70px 70px 80px;gap:0;padding:8px 20px;border-bottom:1px solid var(--border);align-items:center;min-width:560px}
.bet-row:hover{background:var(--bg2)}
.bet-row.strong .bpip{background:var(--green)}
.bet-row.moderate .bpip{background:#f59e0b}
.bet-row.slight .bpip{background:#93c5fd}
.bet-row.none .bpip{background:var(--border2)}
.bpip{width:3px;height:22px;border-radius:2px}
.bc{padding:0 4px;font-size:12px;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bc-game{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
.bc-badge{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:3px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.bc-mono{font-family:var(--mono);font-size:12px;color:var(--ink)}
.bc-edge{font-family:var(--mono);font-size:12px;font-weight:500}
.bc-edge.strong{color:var(--green)}
.bc-edge.moderate{color:var(--amber)}
.bc-edge.slight{color:var(--blue)}
.bc-edge.none{color:var(--ink3)}
.bc-ev{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.bc-ev.pos{color:var(--green)}
.bc-time{font-family:var(--mono);font-size:10px;color:var(--ink4);text-align:right}
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-icon{font-size:28px;color:var(--border2);font-family:var(--mono)}
.empty p{font-size:11px;letter-spacing:1px;margin-top:8px}

/* ─ Games grid ─ */
.games-wrap{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.gc{border:1px solid var(--border2);border-radius:6px;background:#fff;overflow:hidden}
.gc-hd{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;background:var(--bg2)}
.gc-teams{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink)}
.gc-sep{color:var(--ink4);margin:0 4px;font-weight:400}
.gc-meta{font-size:10px;color:var(--ink3);margin-top:3px}
.gc-tr{text-align:right}
.gc-time{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.gc-best{font-family:var(--mono);font-size:10px;color:var(--green);margin-top:3px;font-weight:500}

.gc-odds{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.gc-ob{padding:9px 10px;border-right:1px solid var(--border)}
.gc-ob:last-child{border-right:none}
.gc-ol{font-size:9px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.gc-ov{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
.gc-oe{font-size:10px;margin-top:2px;font-family:var(--mono)}
.gc-oe.strong{color:var(--green)}
.gc-oe.moderate{color:var(--amber)}
.gc-oe.slight{color:var(--blue)}
.gc-oe.none{color:var(--ink4)}

.gc-model-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.gc-ms{padding:7px 10px;border-right:1px solid var(--border)}
.gc-ms:last-child{border-right:none}
.gc-ms-lbl{font-size:9px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.gc-ms-val{font-family:var(--mono);font-size:11px;color:var(--ink2)}

.gc-actions{display:flex;border-bottom:1px solid var(--border)}
.gc-action-btn{flex:1;padding:7px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;background:#fff;border:none;border-right:1px solid var(--border);color:var(--ink3);cursor:pointer}
.gc-action-btn:last-child{border-right:none}
.gc-action-btn:hover{background:var(--bg2);color:var(--ink)}
.gc-action-btn.on{background:var(--bg3);color:var(--ink);font-weight:500}

.gc-section{display:none;padding:12px 14px;border-bottom:1px solid var(--border)}
.gc-section.on{display:block}
.gc-section-title{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lu-team-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.lu-pitcher{font-size:11px;color:var(--ink2);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.lu-pitcher b{color:var(--ink);font-weight:500}
.lu-row{display:flex;gap:5px;padding:3px 0;font-size:11px;border-bottom:1px solid var(--bg3)}
.lu-row:last-child{border:none}
.lu-num{color:var(--ink4);font-family:var(--mono);width:14px;text-align:right;flex-shrink:0;font-size:10px}

function toggleSection(gi,section,btn){
  const el=document.getElementById(`gc-${section==='lineup'?'lu':'model'}-${gi}`);
  const open=el.classList.toggle('on');
  const btns=document.querySelectorAll(`#gc-${gi} .gc-action-btn`);
  btns.forEach(b=>b.classList.remove('on'));
  if(open) btn.classList.add('on');
}

// ─ Player picker ─
function openPicker(tab,side,slotIdx,abbr){
  pickerCallback={tab,side,slotIdx,abbr};
  // Build full pool from ALL teams so cross-team selection works
  const allPlayers=[];
  const pool=DATA.roster_pool||{};
  Object.entries(pool).forEach(([team,players])=>{
    (players||[]).forEach(p=>allPlayers.push({...p,team}));
  });
  allPlayers.sort((a,b)=>a.name.localeCompare(b.name));
  pickerCallback.allPlayers=allPlayers;
  document.getElementById('picker-title').textContent=`Change player — ${abbr} ${side} slot ${slotIdx+1}`;
  document.getElementById('picker-search').value='';
  renderPickerList(allPlayers,'');
  document.getElementById('picker-overlay').classList.add('on');
  document.getElementById('picker-search').focus();
}
function closePicker(){
  document.getElementById('picker-overlay').classList.remove('on');
  pickerCallback=null;
}
function filterPicker(){
  const q=document.getElementById('picker-search').value.toLowerCase();
  if(!pickerCallback?.allPlayers) return;
  renderPickerList(pickerCallback.allPlayers,q);
}
function renderPickerList(pool,q){
  const el=document.getElementById('picker-list');
  const filtered=pool.filter(p=>
    !q||p.name?.toLowerCase().includes(q)||p.position?.toLowerCase().includes(q));
  if(!filtered.length){el.innerHTML='<div class="picker-empty">No players found</div>';return;}
  el.innerHTML=filtered.slice(0,80).map(p=>`
    <div class="picker-player" onclick="selectPlayer('${p.name}','${p.position||'?'}','${p.team||''}')">
      <span class="picker-player-name">${p.name}</span>
      <span style="font-size:10px;color:var(--ink3);font-family:var(--mono);margin-right:4px">${p.team||''}</span>
      <span class="picker-player-pos">${p.position||'?'}</span>
    </div>`).join('');
}
function selectPlayer(name,pos,team){
  if(!pickerCallback) return;
  const {tab,side,slotIdx,abbr}=pickerCallback;
  // Use the selected player's actual team for the lookup suffix
  const suffix=team||abbr;
  const key=tab+'_'+side;
  const g=DATA.games.find(x=>x.tab===tab);
  if(!g) return;
  const original=side==='away'?[...g.away_lineup]:[...g.home_lineup];
  if(!overrides[key]) overrides[key]=[...original];
  if(overrides[key][slotIdx])
    overrides[key][slotIdx]={...overrides[key][slotIdx],name:name+' '+suffix};
  else
    overrides[key][slotIdx]={order:slotIdx+1,pos:'x',name:name+' '+suffix,hand:'R'};

  const gi=DATA.games.findIndex(x=>x.tab===tab);
  const gridEl=document.getElementById('gc-lu-grid-'+gi);
  if(gridEl) gridEl.innerHTML=renderLineupCol(g,'away')+renderLineupCol(g,'home');
  closePicker();
}
document.getElementById('picker-overlay').addEventListener('click',function(e){
  if(e.target===this) closePicker();
});

function setView(v,btn){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.getElementById('view-'+v).classList.add('on');
  btn.classList.add('on');
}
