<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MANUBETS — MLB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f8f8f6;--bg3:#f0f0ec;
  --border:#e4e4de;--border2:#c8c8c0;
  --ink:#0a0a08;--ink2:#3a3a34;--ink3:#7a7a70;--ink4:#b0b0a8;
  --green:#0a7c3e;--green-bg:#ecfdf3;
  --amber:#92600a;--amber-bg:#fffbeb;
  --blue:#1a56db;--blue-bg:#eff4ff;
  --red:#be1b1b;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5}

/* Lock */
#lock{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:1000}
.lock-title{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:4px;text-transform:uppercase;text-align:center}
.lock-title small{display:block;font-size:10px;letter-spacing:3px;color:var(--ink3);margin-top:4px;font-weight:400}
.lock-box{width:260px;display:flex;flex-direction:column;gap:8px}
.lock-input{width:100%;border:1px solid var(--border2);background:#fff;font-family:var(--mono);font-size:13px;padding:9px 12px;outline:none;color:var(--ink);border-radius:2px;letter-spacing:2px;text-align:center}
.lock-input:focus{border-color:var(--ink)}
.lock-btn{background:var(--ink);color:#fff;border:none;font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:10px;cursor:pointer;border-radius:2px;width:100%}
.lock-err{height:14px;font-size:10px;color:var(--red);text-align:center;letter-spacing:1px}

/* Shell */
#app{display:none;flex-direction:column;min-height:100vh}
#app.on{display:flex}

/* Header */
header{border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:100;flex-shrink:0}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:44px;border-bottom:1px solid var(--border)}
.brand{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase}
.tabs{display:flex}
.tab{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:0 14px;height:44px;display:flex;align-items:center;border:none;background:transparent;cursor:pointer;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.hdr-right{display:flex;align-items:center;gap:10px}
.live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.upd{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.refresh{font-family:var(--mono);font-size:10px;padding:5px 10px;background:#fff;border:1px solid var(--border2);color:var(--ink3);cursor:pointer;border-radius:2px}
.refresh:hover{border-color:var(--ink);color:var(--ink)}

/* Ticker */
.ticker{background:var(--bg2);border-bottom:1px solid var(--border);height:32px;display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.ticker::-webkit-scrollbar{display:none}
.tick{display:flex;gap:6px;align-items:center;padding:0 16px;border-right:1px solid var(--border);height:100%;white-space:nowrap;flex-shrink:0}
.tick-l{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3)}
.tick-v{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.tick-s{font-family:var(--mono);font-size:9px;color:var(--ink4)}

/* Main */
main{flex:1}
.view{display:none}
.view.on{display:block}

/* Filter bar */
.fbar{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid var(--border);background:#fff;flex-wrap:wrap}
.flbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink4);margin-right:2px}
.fbtn{font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:4px 10px;background:#fff;border:1px solid var(--border);color:var(--ink3);cursor:pointer;border-radius:2px}
.fbtn:hover{border-color:var(--border2);color:var(--ink2)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fsep{width:1px;height:16px;background:var(--border);margin:0 4px}

/* Bet table */
.tbl-head{display:grid;grid-template-columns:16px 110px 36px 90px 60px 64px 64px 64px 1fr;gap:0;padding:6px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:89px;z-index:50}
.th{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);padding:0 4px}
.sec-hd{display:flex;align-items:center;gap:8px;padding:7px 20px;background:var(--bg3);border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.sec-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3)}
.sec-badge{font-family:var(--mono);font-size:9px;font-weight:500;padding:1px 6px;border-radius:2px}
.badge-strong{background:var(--green-bg);color:var(--green)}
.badge-moderate{background:var(--amber-bg);color:var(--amber)}
.badge-slight{background:var(--blue-bg);color:var(--blue)}
.badge-none{background:var(--bg3);color:var(--ink3)}

.bet{display:grid;grid-template-columns:16px 110px 36px 90px 60px 64px 64px 64px 1fr;gap:0;padding:7px 20px;border-bottom:1px solid var(--border);align-items:center;cursor:default}
.bet:hover{background:var(--bg2)}
.bet.strong .bflag{background:var(--green)}
.bet.moderate .bflag{background:#f59e0b}
.bet.slight .bflag{background:#93c5fd}
.bet.none .bflag{background:var(--border2)}
.bflag{width:3px;height:26px;border-radius:1px;margin:0 auto}
.bc{padding:0 4px;font-size:12px;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bc-match{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
.bc-type{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:1px;padding:2px 5px;border-radius:2px;background:var(--blue-bg);color:var(--blue)}
.bc-num{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.bc-edge{font-family:var(--mono);font-size:12px;font-weight:500}
.bc-edge.strong{color:var(--green)}
.bc-edge.moderate{color:var(--amber)}
.bc-edge.slight{color:var(--blue)}
.bc-edge.none{color:var(--ink3)}
.bc-ev{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.bc-ev.pos{color:var(--green)}
.bc-time{font-family:var(--mono);font-size:10px;color:var(--ink4);text-align:right}

.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-big{font-family:var(--mono);font-size:28px;color:var(--border2)}
.empty p{font-size:11px;letter-spacing:1px;margin-top:10px}

/* Games grid */
.games-wrap{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.gc{border:1px solid var(--border);border-radius:4px;background:#fff;overflow:hidden}
.gc-hd{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;background:var(--bg2);cursor:pointer;user-select:none}
.gc-hd:hover{background:var(--bg3)}
.gc-teams{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink)}
.gc-at{color:var(--ink3);font-weight:400;margin:0 4px}
.gc-meta{font-size:10px;color:var(--ink3);margin-top:3px}
.gc-tr{text-align:right}
.gc-time{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.gc-best{font-family:var(--mono);font-size:10px;color:var(--green);margin-top:3px}

.gc-odds{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.gc-ob{padding:8px 10px;border-right:1px solid var(--border)}
.gc-ob:last-child{border-right:none}
.gc-ol{font-size:9px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.gc-ov{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
.gc-oe{font-size:10px;margin-top:2px;font-family:var(--mono)}
.gc-oe.strong{color:var(--green)}
.gc-oe.moderate{color:var(--amber)}
.gc-oe.slight{color:var(--blue)}
.gc-oe.none{color:var(--ink4)}

.gc-toggle{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-top:1px solid var(--border);cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ink3);user-select:none}
.gc-toggle:hover{background:var(--bg2);color:var(--ink)}
.gc-lineups{display:none;padding:12px 14px;border-top:1px solid var(--border)}
.gc-lineups.on{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gc-lhd{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.gc-pitcher{font-size:11px;color:var(--ink2);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.gc-pitcher b{color:var(--ink);font-weight:500}
.gc-brow{display:flex;gap:6px;padding:3px 0;font-size:11px;border-bottom:1px solid var(--bg3)}
.gc-brow:last-child{border:none}
.gc-bn{color:var(--ink3);font-family:var(--mono);width:14px;text-align:right;flex-shrink:0;font-size:10px}
.gc-bname{color:var(--ink2);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gc-bhand{color:var(--ink4);font-family:var(--mono);font-size:10px;width:12px;flex-shrink:0}

/* Loading */
#loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#loading.on{display:flex}
.spin{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink3)}

@media(max-width:640px){
  .hdr{padding:0 12px}
  main{padding:0}
  .tbl-head,.bet{grid-template-columns:16px 90px 32px 80px 56px 60px 60px 1fr}
  .bc-time{display:none}
  .games-wrap{grid-template-columns:1fr;padding:10px}
  .gc-odds{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="lock">
  <div class="lock-title">MANUBETS<small>MLB MODEL · MEMBERS ONLY</small></div>
  <div class="lock-box">
    <input id="pw" class="lock-input" type="password" placeholder="PASSWORD" autocomplete="current-password">
    <button class="lock-btn" onclick="unlock()">ENTER</button>
    <div class="lock-err" id="pw-err"></div>
  </div>
</div>

<div id="loading"><div class="spin"></div><div class="load-txt">LOADING</div></div>

<div id="app">
  <header>
    <div class="hdr">
      <div class="brand">MANUBETS <span style="color:var(--ink3);font-weight:400">/ MLB</span></div>
      <div class="tabs">
        <button class="tab on" onclick="setView('bets',this)">BET LIST</button>
        <button class="tab"    onclick="setView('games',this)">GAMES</button>
      </div>
      <div class="hdr-right">
        <div class="live"></div>
        <div class="upd" id="upd">—</div>
        <button class="refresh" onclick="load()">↻ REFRESH</button>
      </div>
    </div>
    <div class="ticker">
      <div class="tick"><span class="tick-l">Date</span><span class="tick-v" id="t-date">—</span></div>
      <div class="tick"><span class="tick-l">Games</span><span class="tick-v" id="t-games">—</span></div>
      <div class="tick"><span class="tick-l">Strong</span><span class="tick-v" id="t-strong">—</span><span class="tick-s">≥5%</span></div>
      <div class="tick"><span class="tick-l">Moderate</span><span class="tick-v" id="t-mod">—</span><span class="tick-s">≥2%</span></div>
      <div class="tick"><span class="tick-l">Updated</span><span class="tick-v" id="t-upd" style="font-size:10px">—</span></div>
    </div>
  </header>

  <main>
    <div class="view on" id="view-bets">
      <div class="fbar">
        <span class="flbl">Edge</span>
        <button class="fbtn on" data-ef="all"      onclick="setEF(this)">ALL</button>
        <button class="fbtn"    data-ef="strong"   onclick="setEF(this)">STRONG</button>
        <button class="fbtn"    data-ef="moderate" onclick="setEF(this)">MOD+</button>
      </div>
      <div class="tbl-head">
        <div class="th"></div>
        <div class="th">GAME</div>
        <div class="th">TYPE</div>
        <div class="th">SIDE</div>
        <div class="th">BOOK</div>
        <div class="th">FAIR</div>
        <div class="th">EDGE</div>
        <div class="th">EV</div>
        <div class="th" style="text-align:right">TIME</div>
      </div>
      <div id="bet-list"></div>
    </div>

    <div class="view" id="view-games">
      <div class="games-wrap" id="games-grid"></div>
    </div>
  </main>
</div>

<script>
const PW_HASH='%%PASSWORD_HASH%%';
const SK='mlb_auth';
let DATA=null, ef='all';

async function sha(pw){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+'manubets_salt_2026'));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function unlock(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('pw-err');
  if(!pw){err.textContent='enter password';return;}
  const h=await sha(pw);
  if(h===PW_HASH){sessionStorage.setItem(SK,h);show();}
  else{err.textContent='incorrect password';document.getElementById('pw').value='';document.getElementById('pw').focus();}
}
function show(){
  document.getElementById('lock').style.display='none';
  document.getElementById('app').classList.add('on');
  load();
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
(async()=>{if(sessionStorage.getItem(SK)===PW_HASH)show();})();

async function load(){
  document.getElementById('loading').classList.add('on');
  try{
    const r=await fetch('data.json?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json();
    tick(); renderBets(); renderGames();
  }catch(e){
    document.getElementById('bet-list').innerHTML=`<div class="empty"><div class="empty-big">!</div><p>${e.message}</p></div>`;
  }finally{document.getElementById('loading').classList.remove('on');}
}

function tick(){
  const m=DATA.meta;
  const months=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const d=m.date?m.date.split('-'):null;
  document.getElementById('t-date').textContent   = d?months[+d[1]-1]+' '+d[2]:'—';
  document.getElementById('t-games').textContent  = m.n_games??'—';
  document.getElementById('t-strong').textContent = m.n_strong??'—';
  document.getElementById('t-mod').textContent    = m.n_moderate??'—';
  const upd = m.updated_at ? new Date(m.updated_at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York'})+' ET' : '—';
  document.getElementById('t-upd').textContent = upd;
  document.getElementById('upd').textContent   = upd;
}

function fl(n){if(n==null||isNaN(n))return'—';const r=Math.round(n);return r>0?'+'+r:''+r;}
function fe(e){if(e==null||isNaN(e))return'—';return(e>0?'+':'')+(e*100).toFixed(1)+'%';}
function fev(e){if(e==null||isNaN(e))return'—';return(e>0?'+':'')+(e*100).toFixed(2)+'%';}

function filteredBets(){
  if(!DATA?.bets) return[];
  return DATA.bets.filter(b=>{
    if(ef==='strong'   && b.tier!=='strong') return false;
    if(ef==='moderate' && !['strong','moderate'].includes(b.tier)) return false;
    return true;
  });
}
function setEF(btn){
  document.querySelectorAll('[data-ef]').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); ef=btn.dataset.ef; renderBets();
}

function renderBets(){
  const bets=filteredBets();
  const el=document.getElementById('bet-list');
  if(!bets.length){el.innerHTML='<div class="empty"><div class="empty-big">—</div><p>NO BETS MATCH FILTERS</p></div>';return;}
  const tiers=[
    {k:'strong',  l:'▲ STRONG EDGE',   b:'strong'},
    {k:'moderate',l:'◆ MODERATE EDGE', b:'moderate'},
    {k:'slight',  l:'· SLIGHT EDGE',   b:'slight'},
    {k:'none',    l:'· NO EDGE',       b:'none'},
  ];
  let h='';
  tiers.forEach(tier=>{
    const grp=bets.filter(b=>b.tier===tier.k);
    if(!grp.length) return;
    h+=`<div class="sec-hd"><span class="sec-lbl">${tier.l}</span><span class="sec-badge badge-${tier.b}">${grp.length}</span></div>`;
    grp.forEach(b=>{
      const t=b.tier||'none';
      h+=`<div class="bet ${t}">
        <div class="bc"><div class="bflag"></div></div>
        <div class="bc bc-match">${b.matchup||'—'}</div>
        <div class="bc"><span class="bc-type">${b.type||'ML'}</span></div>
        <div class="bc">${b.side||'—'}</div>
        <div class="bc bc-num">${fl(b.line)}</div>
        <div class="bc bc-num" style="color:var(--ink3)">${fl(b.fair)}</div>
        <div class="bc bc-edge ${t}">${fe(b.edge)}</div>
        <div class="bc bc-ev ${b.ev>0?'pos':''}">${fev(b.ev)}</div>
        <div class="bc bc-time">${b.time||''}</div>
      </div>`;
    });
  });
  el.innerHTML=h;
}

function renderGames(){
  const el=document.getElementById('games-grid');
  if(!DATA?.games?.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-big">—</div><p>NO GAMES</p></div>';return;}
  el.innerHTML=DATA.games.map((g,gi)=>{
    const ba=g.bets?.away, bh=g.bets?.home;
    const best=[ba,bh].filter(Boolean).sort((a,b)=>(b.edge||0)-(a.edge||0))[0];
    const bestLabel=best&&['strong','moderate'].includes(best.tier)?`▸ ${best.side} ${fe(best.edge)}`:'';

    const oddsBoxes=[
      {lbl:g.away_abbr+' ML', val:fl(g.odds?.book_a), tier:ba?.tier||'none', edge:fe(ba?.edge)},
      {lbl:g.home_abbr+' ML', val:fl(g.odds?.book_h), tier:bh?.tier||'none', edge:fe(bh?.edge)},
      {lbl:'OVER',  val:fl(g.odds?.over_ml),  tier:'none', edge:'—'},
      {lbl:'UNDER', val:fl(g.odds?.under_ml), tier:'none', edge:'—'},
    ].map(b=>`<div class="gc-ob">
      <div class="gc-ol">${b.lbl}</div>
      <div class="gc-ov">${b.val}</div>
      <div class="gc-oe ${b.tier}">${b.edge}</div>
    </div>`).join('');

    const batters=(lu,abbr)=>(lu||[]).map(p=>`<div class="gc-brow">
      <span class="gc-bn">${p.order}</span>
      <span class="gc-bname">${(p.name||'').replace(' '+abbr,'')}</span>
      <span class="gc-bhand">${p.hand||''}</span>
    </div>`).join('');

    return`<div class="gc">
      <div class="gc-hd" onclick="toggleLU(${gi},this)">
        <div>
          <div class="gc-teams">${g.away_abbr}<span class="gc-at">@</span>${g.home_abbr}</div>
          <div class="gc-meta">${g.away_pitcher?.name||'TBD'} vs ${g.home_pitcher?.name||'TBD'}</div>
        </div>
        <div class="gc-tr">
          <div class="gc-time">${g.game_time||''}</div>
          ${bestLabel?`<div class="gc-best">${bestLabel}</div>`:''}
        </div>
      </div>
      <div class="gc-odds">${oddsBoxes}</div>
      <div class="gc-lineups" id="lu-${gi}">
        <div>
          <div class="gc-lhd">${g.away_abbr} — AWAY</div>
          <div class="gc-pitcher"><b>${g.away_pitcher?.name||'TBD'}</b>${g.away_pitcher?.throws?' · '+g.away_pitcher.throws+'HP':''}</div>
          ${batters(g.away_lineup,g.away_abbr)}
        </div>
        <div>
          <div class="gc-lhd">${g.home_abbr} — HOME</div>
          <div class="gc-pitcher"><b>${g.home_pitcher?.name||'TBD'}</b>${g.home_pitcher?.throws?' · '+g.home_pitcher.throws+'HP':''}</div>
          ${batters(g.home_lineup,g.home_abbr)}
        </div>
      </div>
      <div class="gc-toggle" id="tgl-${gi}">▸ SHOW LINEUPS</div>
    </div>`;
  }).join('');
}

function toggleLU(gi){
  const el=document.getElementById('lu-'+gi);
  const tgl=document.getElementById('tgl-'+gi);
  const open=el.classList.toggle('on');
  tgl.textContent=open?'▾ HIDE LINEUPS':'▸ SHOW LINEUPS';
}
function setView(v,btn){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
