<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLB Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f8f8f6;--bg3:#f2f2ee;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.16);
  --ink:#111;--ink2:#444;--ink3:#777;--ink4:#aaa;
  --green:#0a7c3e;--green-bg:#ecfdf3;--green-border:#bbf7d0;
  --amber:#92600a;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --blue:#1a56db;--blue-bg:#eff4ff;--blue-border:#bfdbfe;
  --red:#be1b1b;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5}

/* ─ Lock ─ */
#lock{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:2000}
.lock-logo{display:flex;align-items:center;gap:10px}
.lock-logo-icon{width:36px;height:36px;border:1.5px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:1px}
.lock-logo-text{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.lock-logo-sub{font-size:10px;letter-spacing:2px;color:var(--ink3);font-weight:400}
.lock-form{width:240px;display:flex;flex-direction:column;gap:8px}
.lock-input{width:100%;border:1px solid var(--border2);background:#fff;font-family:var(--mono);font-size:13px;padding:9px 12px;outline:none;border-radius:4px;letter-spacing:2px;text-align:center;color:var(--ink)}
.lock-input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,0.06)}
.lock-btn{background:var(--ink);color:#fff;border:none;font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:10px;cursor:pointer;border-radius:4px}
.lock-btn:hover{background:#333}
.lock-err{height:14px;font-size:10px;color:var(--red);text-align:center}
.lock-hint{font-size:10px;color:var(--ink4);text-align:center}

/* ─ App ─ */
#app{display:none;flex-direction:column;min-height:100vh}
#app.on{display:flex}

/* ─ Header ─ */
header{border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:100;flex-shrink:0}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-logo-box{width:28px;height:28px;border:1.5px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.5px}
.hdr-logo-name{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.hdr-tabs{display:flex;gap:2px}
.tab{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink3);border-radius:4px}
.tab:hover{color:var(--ink);background:var(--bg2)}
.tab.on{color:var(--ink);background:var(--bg3);border-color:var(--border2)}
.hdr-right{display:flex;align-items:center;gap:10px}
.live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.upd-time{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.btn-refresh{font-family:var(--mono);font-size:10px;padding:5px 10px;background:#fff;border:1px solid var(--border2);color:var(--ink3);cursor:pointer;border-radius:4px}
.btn-refresh:hover{border-color:var(--ink);color:var(--ink)}

/* ─ Stats bar ─ */
.stats-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:36px;display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.stats-bar::-webkit-scrollbar{display:none}
.stat{display:flex;align-items:center;gap:8px;padding:0 16px;border-right:1px solid var(--border);height:100%;white-space:nowrap;flex-shrink:0}
.stat-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3)}
.stat-val{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink)}
.stat-sub{font-family:var(--mono);font-size:9px;color:var(--ink4)}

/* ─ Main ─ */
main{flex:1}
.view{display:none}
.view.on{display:block}

/* ─ Filter bar ─ */
.fbar{display:flex;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid var(--border);background:#fff;flex-wrap:wrap}
.flbl{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink4)}
.fbtn{font-family:var(--mono);font-size:10px;letter-spacing:0.5px;padding:4px 10px;background:#fff;border:1px solid var(--border2);color:var(--ink3);cursor:pointer;border-radius:4px}
.fbtn:hover{border-color:var(--ink2);color:var(--ink2)}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fsep{width:1px;height:16px;background:var(--border2);margin:0 4px}

/* ─ Bet table ─ */
.tbl-wrap{overflow-x:auto}
.tbl-head{display:grid;grid-template-columns:12px 1fr 38px 90px 64px 64px 70px 70px 80px;gap:0;padding:7px 20px;background:var(--bg3);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:50;min-width:560px}
.th{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);padding:0 4px}
.sec-hd{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.sec-lbl{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3)}
.badge{font-family:var(--mono);font-size:9px;font-weight:500;padding:2px 7px;border-radius:3px}
.badge-strong{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-moderate{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.badge-slight{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.badge-none{background:var(--bg3);color:var(--ink3);border:1px solid var(--border2)}

.bet-row{display:grid;grid-template-columns:12px 1fr 38px 90px 64px 64px 70px 70px 80px;gap:0;padding:8px 20px;border-bottom:1px solid var(--border);align-items:center;min-width:560px}
.bet-row:hover{background:var(--bg2)}
.bet-row.strong .bpip{background:var(--green)}
.bet-row.moderate .bpip{background:#f59e0b}
.bet-row.slight .bpip{background:#93c5fd}
.bet-row.none .bpip{background:var(--border2)}
.bpip{width:3px;height:22px;border-radius:2px}
.bc{padding:0 4px;font-size:12px;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bc-game{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink)}
.bc-badge{display:inline-block;font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:3px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.bc-mono{font-family:var(--mono);font-size:12px;color:var(--ink)}
.bc-edge{font-family:var(--mono);font-size:12px;font-weight:500}
.bc-edge.strong{color:var(--green)}
.bc-edge.moderate{color:var(--amber)}
.bc-edge.slight{color:var(--blue)}
.bc-edge.none{color:var(--ink3)}
.bc-ev{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.bc-ev.pos{color:var(--green)}
.bc-time{font-family:var(--mono);font-size:10px;color:var(--ink4);text-align:right}
.empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.empty-icon{font-size:28px;color:var(--border2);font-family:var(--mono)}
.empty p{font-size:11px;letter-spacing:1px;margin-top:8px}

/* ─ Games grid ─ */
.games-wrap{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.gc{border:1px solid var(--border2);border-radius:6px;background:#fff;overflow:hidden}
.gc-hd{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;background:var(--bg2)}
.gc-teams{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink)}
.gc-sep{color:var(--ink4);margin:0 4px;font-weight:400}
.gc-meta{font-size:10px;color:var(--ink3);margin-top:3px}
.gc-tr{text-align:right}
.gc-time{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.gc-best{font-family:var(--mono);font-size:10px;color:var(--green);margin-top:3px;font-weight:500}

.gc-odds{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.gc-ob{padding:9px 10px;border-right:1px solid var(--border)}
.gc-ob:last-child{border-right:none}
.gc-ol{font-size:9px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.gc-ov{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink)}
.gc-oe{font-size:10px;margin-top:2px;font-family:var(--mono)}
.gc-oe.strong{color:var(--green)}
.gc-oe.moderate{color:var(--amber)}
.gc-oe.slight{color:var(--blue)}
.gc-oe.none{color:var(--ink4)}

.gc-model-row{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)}
.gc-ms{padding:7px 10px;border-right:1px solid var(--border)}
.gc-ms:last-child{border-right:none}
.gc-ms-lbl{font-size:9px;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.gc-ms-val{font-family:var(--mono);font-size:11px;color:var(--ink2)}

.gc-actions{display:flex;border-bottom:1px solid var(--border)}
.gc-action-btn{flex:1;padding:7px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;background:#fff;border:none;border-right:1px solid var(--border);color:var(--ink3);cursor:pointer}
.gc-action-btn:last-child{border-right:none}
.gc-action-btn:hover{background:var(--bg2);color:var(--ink)}
.gc-action-btn.on{background:var(--bg3);color:var(--ink);font-weight:500}

.gc-section{display:none;padding:12px 14px;border-bottom:1px solid var(--border)}
.gc-section.on{display:block}
.gc-section-title{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lu-team-lbl{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.lu-pitcher{font-size:11px;color:var(--ink2);margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.lu-pitcher b{color:var(--ink);font-weight:500}
.lu-row{display:flex;gap:5px;padding:3px 0;font-size:11px;border-bottom:1px solid var(--bg3)}
.lu-row:last-child{border:none}
.lu-num{color:var(--ink4);font-family:var(--mono);width:14px;text-align:right;flex-shrink:0;font-size:10px}
.lu-name{flex:1;color:var(--ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lu-name.missing{color:var(--red);font-style:italic}
.lu-hand{color:var(--ink4);font-family:var(--mono);font-size:10px;width:12px;flex-shrink:0}

/* ─ Player picker modal ─ */
.picker-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;align-items:center;justify-content:center}
.picker-overlay.on{display:flex}
.picker-modal{background:#fff;border-radius:8px;width:380px;max-height:560px;display:flex;flex-direction:column;border:1px solid var(--border2);overflow:hidden}
.picker-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.picker-title{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.picker-close{background:none;border:none;cursor:pointer;color:var(--ink3);font-size:16px;line-height:1;padding:0}
.picker-close:hover{color:var(--ink)}
.picker-search{padding:10px 14px;border-bottom:1px solid var(--border)}
.picker-search input{width:100%;border:1px solid var(--border2);border-radius:4px;padding:7px 10px;font-family:var(--sans);font-size:12px;outline:none;color:var(--ink)}
.picker-search input:focus{border-color:var(--ink)}
.picker-list{flex:1;overflow-y:auto;padding:4px 0}
.picker-player{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.picker-player:last-child{border:none}
.picker-player:hover{background:var(--bg2)}
.picker-player-name{font-size:12px;color:var(--ink);flex:1}
.picker-player-pos{font-family:var(--mono);font-size:10px;color:var(--ink3);width:28px;text-align:right}
.picker-empty{padding:24px;text-align:center;color:var(--ink3);font-size:11px}

/* ─ Loading ─ */
#loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:400;align-items:center;justify-content:center;flex-direction:column;gap:10px}
#loading.on{display:flex}
.spin{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-txt{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink3)}

@media(max-width:640px){
  .hdr{padding:0 12px}.hdr-logo-name{display:none}
  .tbl-head,.bet-row{grid-template-columns:10px 1fr 34px 80px 60px 60px 64px 1fr}
  .bc-time,.th:last-child{display:none}
  .games-wrap{grid-template-columns:1fr;padding:10px}
  .gc-odds{grid-template-columns:1fr 1fr}
  .lineup-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="lock">
  <div class="lock-logo">
    <div class="lock-logo-icon">MLB</div>
    <div>
      <div class="lock-logo-text">Model</div>
      <div class="lock-logo-sub">Members only</div>
    </div>
  </div>
  <div class="lock-form">
    <input id="pw" class="lock-input" type="password" placeholder="PASSWORD" autocomplete="current-password">
    <button class="lock-btn" onclick="unlock()">Enter</button>
    <div class="lock-err" id="pw-err"></div>
    <div class="lock-hint">Access restricted to invited members</div>
  </div>
</div>

<div id="loading"><div class="spin"></div><div class="load-txt">LOADING</div></div>

<div class="picker-overlay" id="picker-overlay">
  <div class="picker-modal">
    <div class="picker-hd">
      <div class="picker-title" id="picker-title">Select player</div>
      <button class="picker-close" onclick="closePicker()">✕</button>
    </div>
    <div class="picker-search">
      <input type="text" id="picker-search" placeholder="Search by name or position…" oninput="filterPicker()">
    </div>
    <div class="picker-list" id="picker-list"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="hdr">
      <div class="hdr-logo">
        <div class="hdr-logo-box">MLB</div>
        <div class="hdr-logo-name">Model</div>
      </div>
      <div class="hdr-tabs">
        <button class="tab on" onclick="setView('bets',this)">Bet list</button>
        <button class="tab"    onclick="setView('games',this)">Games</button>
      </div>
      <div class="hdr-right">
        <div class="live"></div>
        <div class="upd-time" id="upd">—</div>
        <button class="btn-refresh" onclick="load()">↻ Refresh</button>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat"><span class="stat-lbl">Date</span><span class="stat-val" id="t-date">—</span></div>
      <div class="stat"><span class="stat-lbl">Games</span><span class="stat-val" id="t-games">—</span></div>
      <div class="stat"><span class="stat-lbl">Strong edges</span><span class="stat-val" id="t-strong">—</span><span class="stat-sub">≥5%</span></div>
      <div class="stat"><span class="stat-lbl">Moderate</span><span class="stat-val" id="t-mod">—</span><span class="stat-sub">≥2%</span></div>
      <div class="stat"><span class="stat-lbl">Updated</span><span class="stat-val" id="t-upd" style="font-size:10px">—</span></div>
    </div>
  </header>

  <main>
    <div class="view on" id="view-bets">
      <div class="fbar">
        <span class="flbl">Edge</span>
        <button class="fbtn on" data-ef="all"      onclick="setEF(this)">All</button>
        <button class="fbtn"    data-ef="strong"   onclick="setEF(this)">Strong</button>
        <button class="fbtn"    data-ef="moderate" onclick="setEF(this)">Mod+</button>
      </div>
      <div class="tbl-wrap">
        <div class="tbl-head">
          <div class="th"></div>
          <div class="th">Game</div>
          <div class="th">Type</div>
          <div class="th">Side</div>
          <div class="th">Book</div>
          <div class="th">Fair</div>
          <div class="th">Edge</div>
          <div class="th">EV</div>
          <div class="th" style="text-align:right">Time</div>
        </div>
        <div id="bet-list"></div>
      </div>
    </div>

    <div class="view" id="view-games">
      <div class="games-wrap" id="games-grid"></div>
    </div>
  </main>
</div>

<script>
const PW_HASH='121c2ecbc9bc307df06c85c863b9ef8fc5aa512fcbeec25f667d2a2d9e33a5dd';
const SK='mlb_auth_v2';
let DATA=null, ef='all';
let pickerCallback=null, pickerTeam=null, pickerSlot=null;
const overrides={};

async function sha(pw){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+'manubets_salt_2026'));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function unlock(){
  const pw=document.getElementById('pw').value.trim();
  const err=document.getElementById('pw-err');
  if(!pw){err.textContent='enter a password';return;}
  const h=await sha(pw);
  if(h===PW_HASH){sessionStorage.setItem(SK,h);show();}
  else{err.textContent='incorrect password';document.getElementById('pw').value='';document.getElementById('pw').focus();}
}
function show(){document.getElementById('lock').style.display='none';document.getElementById('app').classList.add('on');load();}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
(async()=>{if(sessionStorage.getItem(SK)===PW_HASH)show();})();

async function load(){
  document.getElementById('loading').classList.add('on');
  try{
    const r=await fetch('data.json?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json();
    updateTicker();renderBets();renderGames();
  }catch(e){
    document.getElementById('bet-list').innerHTML=`<div class="empty"><div class="empty-icon">!</div><p>${e.message}</p></div>`;
  }finally{document.getElementById('loading').classList.remove('on');}
}

function updateTicker(){
  const m=DATA.meta;
  const mo=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const d=m.date?m.date.split('-'):null;
  document.getElementById('t-date').textContent   =d?mo[+d[1]-1]+' '+d[2]:'—';
  document.getElementById('t-games').textContent  =m.n_games??'—';
  document.getElementById('t-strong').textContent =m.n_strong??'—';
  document.getElementById('t-mod').textContent    =m.n_moderate??'—';
  const upd=m.updated_at?new Date(m.updated_at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/New_York'})+' ET':'—';
  document.getElementById('t-upd').textContent=upd;
  document.getElementById('upd').textContent=upd;
}

function fl(n){if(n==null||isNaN(n))return'—';const r=Math.round(n);return r>0?'+'+r:String(r);}
function fp(v){if(v==null||isNaN(v))return'—';const p=v>1?v:v*100;return p.toFixed(1)+'%';}
function fe(e){if(e==null||isNaN(e))return'—';const p=Math.abs(e)>1?e:e*100;return(p>0?'+':'')+p.toFixed(1)+'%';}
function fev(e){if(e==null||isNaN(e))return'—';const p=Math.abs(e)>1?e:e*100;return(p>0?'+':'')+p.toFixed(2)+'%';}

function filteredBets(){
  if(!DATA?.bets)return[];
  return DATA.bets.filter(b=>{
    if(ef==='strong'   &&b.tier!=='strong')return false;
    if(ef==='moderate' &&!['strong','moderate'].includes(b.tier))return false;
    return true;
  });
}
function setEF(btn){document.querySelectorAll('[data-ef]').forEach(b=>b.classList.remove('on'));btn.classList.add('on');ef=btn.dataset.ef;renderBets();}

function renderBets(){
  const bets=filteredBets();
  const el=document.getElementById('bet-list');
  if(!bets.length){el.innerHTML='<div class="empty"><div class="empty-icon">—</div><p>No bets match current filters</p></div>';return;}
  const tiers=[
    {k:'strong',  l:'Strong edge',   b:'strong'},
    {k:'moderate',l:'Moderate edge', b:'moderate'},
    {k:'slight',  l:'Slight edge',   b:'slight'},
    {k:'none',    l:'No edge',       b:'none'},
  ];
  let h='';
  tiers.forEach(t=>{
    const g=bets.filter(b=>b.tier===t.k);
    if(!g.length)return;
    h+=`<div class="sec-hd"><span class="sec-lbl">${t.l}</span><span class="badge badge-${t.b}">${g.length}</span></div>`;
    g.forEach(b=>{
      h+=`<div class="bet-row ${b.tier||'none'}">
        <div><div class="bpip"></div></div>
        <div class="bc bc-game">${b.matchup||'—'}</div>
        <div class="bc"><span class="bc-badge">${b.type||'ML'}</span></div>
        <div class="bc">${b.side||'—'}</div>
        <div class="bc bc-mono">${fl(b.line)}</div>
        <div class="bc bc-mono" style="color:var(--ink3)">${fl(b.fair)}</div>
        <div class="bc bc-edge ${b.tier||'none'}">${fe(b.edge)}</div>
        <div class="bc bc-ev ${(b.ev||0)>0?'pos':''}">${fev(b.ev)}</div>
        <div class="bc bc-time">${b.time||''}</div>
      </div>`;
    });
  });
  el.innerHTML=h;
}

function gameLineup(g,side){
  const key=g.tab+'_'+side;
  if(overrides[key]) return overrides[key];
  return side==='away'?g.away_lineup:g.home_lineup;
}

function renderLineupCol(g,side){
  const abbr=side==='away'?g.away_abbr:g.home_abbr;
  const pitcher=side==='away'?g.away_pitcher:g.home_pitcher;
  const lu=gameLineup(g,side);
  const rows=(lu||[]).map((p,i)=>{
    const cleanName=(p.name||'').replace(new RegExp('\\s+'+abbr+'\\s*$'),'').trim();
    const missing=!cleanName||cleanName==='?'||cleanName==='';
    return`<div class="lu-row">
      <span class="lu-num">${p.order||i+1}</span>
      <span class="lu-name ${missing?'missing':''}" 
        onclick="openPicker('${g.tab}','${side}',${i},'${abbr}')" 
        style="cursor:pointer;text-decoration:${missing?'none':'underline dotted var(--ink4)'}"
        title="Click to change player">
        ${missing?'⚠ missing — click to set':cleanName}
      </span>
      <span class="lu-hand">${p.hand||''}</span>
    </div>`;
  }).join('');
  return`<div>
    <div class="lu-team-lbl">${abbr} — ${side}</div>
    <div class="lu-pitcher">
      <b>${pitcher?.name||'TBD'}</b>${pitcher?.throws?' · '+pitcher.throws+'HP':''}
    </div>
    ${rows||'<div style="color:var(--ink3);font-size:11px;padding:8px 0">No lineup available</div>'}
  </div>`;
}

function renderGames(){
  const el=document.getElementById('games-grid');
  if(!DATA?.games?.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-icon">—</div><p>No games today</p></div>';return;}
  el.innerHTML=DATA.games.map((g,gi)=>{
    const ba=g.bets?.away,bh=g.bets?.home;
    const best=[ba,bh].filter(Boolean).sort((a,b)=>(b.edge||0)-(a.edge||0))[0];
    const bestLabel=best&&['strong','moderate'].includes(best.tier)?`▸ ${best.side} ${fe(best.edge)}`:'';
    const hasLineup=(g.away_lineup?.length||0)+(g.home_lineup?.length||0)>0;
    const nMissing=(g.n_missing?.away||0)+(g.n_missing?.home||0);

    const oddsBoxes=[
      {lbl:g.away_abbr+' ML', val:fl(g.odds?.book_a), tier:ba?.tier||'none', edge:fe(ba?.edge)},
      {lbl:g.home_abbr+' ML', val:fl(g.odds?.book_h), tier:bh?.tier||'none', edge:fe(bh?.edge)},
      {lbl:'Over',  val:fl(g.odds?.over_ml),  tier:'none', edge:'—'},
      {lbl:'Under', val:fl(g.odds?.under_ml), tier:'none', edge:'—'},
    ].map(b=>`<div class="gc-ob">
      <div class="gc-ol">${b.lbl}</div>
      <div class="gc-ov">${b.val}</div>
      <div class="gc-oe ${b.tier}">${b.edge}</div>
    </div>`).join('');

    const modelStats=`<div class="gc-model-row">
      <div class="gc-ms"><div class="gc-ms-lbl">Away win%</div><div class="gc-ms-val">${fp(g.model?.away_win_pct)} · ${fl(g.model?.fair_ml_a)}</div></div>
      <div class="gc-ms"><div class="gc-ms-lbl">Home win%</div><div class="gc-ms-val">${fp(g.model?.home_win_pct)} · ${fl(g.model?.fair_ml_h)}</div></div>
      <div class="gc-ms"><div class="gc-ms-lbl">Total</div><div class="gc-ms-val">${g.model?.total?g.model.total.toFixed(1):'—'}</div></div>
    </div>`;

    return`<div class="gc" id="gc-${gi}">
      <div class="gc-hd">
        <div>
          <div class="gc-teams">${g.away_abbr}<span class="gc-sep">@</span>${g.home_abbr}</div>
          <div class="gc-meta">${g.away_pitcher?.name||'TBD'} vs ${g.home_pitcher?.name||'TBD'}</div>
        </div>
        <div class="gc-tr">
          <div class="gc-time">${g.game_time||''}</div>
          ${bestLabel?`<div class="gc-best">${bestLabel}</div>`:''}
          ${nMissing>0?`<div style="font-size:9px;color:var(--amber);font-family:var(--mono);margin-top:2px">⚠ ${nMissing} missing</div>`:''}
        </div>
      </div>
      <div class="gc-odds">${oddsBoxes}</div>
      ${modelStats}
      <div class="gc-actions">
        ${hasLineup?`<button class="gc-action-btn" onclick="toggleSection(${gi},'lineup',this)">Lineup</button>`:''}
        <button class="gc-action-btn" onclick="toggleSection(${gi},'model',this)">Model detail</button>
      </div>
      <div class="gc-section" id="gc-lu-${gi}">
        <div class="gc-section-title">Starting lineups <span style="color:var(--ink4);font-weight:400">· click name to change player</span></div>
        <div class="lineup-grid" id="gc-lu-grid-${gi}">
          ${renderLineupCol(g,'away')}
          ${renderLineupCol(g,'home')}
        </div>
      </div>
      <div class="gc-section" id="gc-model-${gi}">
        <div class="gc-section-title">Model detail</div>
        <table style="width:100%;font-size:11px;border-collapse:collapse">
          <tr style="border-bottom:1px solid var(--border)">
            <td style="padding:4px 0;color:var(--ink3);font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:1px">Metric</td>
            <td style="padding:4px 6px;color:var(--ink3);font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:1px;text-align:right">${g.away_abbr}</td>
            <td style="padding:4px 0;color:var(--ink3);font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:1px;text-align:right">${g.home_abbr}</td>
          </tr>
          ${[
            ['xWins',     g.model?.away_xw?.toFixed(1),    g.model?.home_xw?.toFixed(1)],
            ['Team Wins',  g.model?.away_tw?.toFixed(1),   g.model?.home_tw?.toFixed(1)],
            ['Bullpen',    g.model?.away_bull?.toFixed(3),  g.model?.home_bull?.toFixed(3)],
            ['RS 162',     g.model?.rs_away?.toFixed(1),   g.model?.rs_home?.toFixed(1)],
            ['RA 162',     g.model?.ra_away?.toFixed(1),   g.model?.ra_home?.toFixed(1)],
            ['PF',         g.model?.pf_away?.toFixed(2),   g.model?.pf_home?.toFixed(2)],
            ['Starter ERA',g.away_pitcher?.era?.toFixed(2), g.home_pitcher?.era?.toFixed(2)],
            ['Total ERA',  g.away_pitcher?.tot_era?.toFixed(2), g.home_pitcher?.tot_era?.toFixed(2)],
          ].map(([lbl,a,h])=>`<tr style="border-bottom:1px solid var(--bg3)">
            <td style="padding:4px 0;color:var(--ink2)">${lbl}</td>
            <td style="padding:4px 6px;font-family:var(--mono);text-align:right;color:var(--ink)">${a||'—'}</td>
            <td style="padding:4px 0;font-family:var(--mono);text-align:right;color:var(--ink)">${h||'—'}</td>
          </tr>`).join('')}
        </table>
      </div>
    </div>`;
  }).join('');
}

function toggleSection(gi,section,btn){
  const el=document.getElementById(`gc-${section==='lineup'?'lu':'model'}-${gi}`);
  const open=el.classList.toggle('on');
  const btns=document.querySelectorAll(`#gc-${gi} .gc-action-btn`);
  btns.forEach(b=>b.classList.remove('on'));
  if(open) btn.classList.add('on');
}

// ─ Player picker ─
function openPicker(tab,side,slotIdx,abbr){
  pickerCallback={tab,side,slotIdx,abbr};
  const pool=DATA.roster_pool?.[abbr]||[];
  document.getElementById('picker-title').textContent=`Change player — ${abbr} ${side} #${slotIdx+1}`;
  document.getElementById('picker-search').value='';
  renderPickerList(pool,'');
  document.getElementById('picker-overlay').classList.add('on');
  document.getElementById('picker-search').focus();
}
function closePicker(){
  document.getElementById('picker-overlay').classList.remove('on');
  pickerCallback=null;
}
function filterPicker(){
  const q=document.getElementById('picker-search').value.toLowerCase();
  const abbr=pickerCallback?.abbr;
  if(!abbr) return;
  renderPickerList(DATA.roster_pool?.[abbr]||[],q);
}
function renderPickerList(pool,q){
  const el=document.getElementById('picker-list');
  const filtered=pool.filter(p=>
    !q||p.name?.toLowerCase().includes(q)||p.position?.toLowerCase().includes(q));
  if(!filtered.length){el.innerHTML='<div class="picker-empty">No players found</div>';return;}
  el.innerHTML=filtered.map(p=>`
    <div class="picker-player" onclick="selectPlayer('${p.name}','${p.position||'?'}')">
      <span class="picker-player-name">${p.name}</span>
      <span class="picker-player-pos">${p.position||'?'}</span>
    </div>`).join('');
}
function selectPlayer(name,pos){
  if(!pickerCallback) return;
  const {tab,side,slotIdx,abbr}=pickerCallback;
  const key=tab+'_'+side;
  const g=DATA.games.find(x=>x.tab===tab);
  if(!g) return;
  const original=side==='away'?[...g.away_lineup]:[...g.home_lineup];
  if(!overrides[key]) overrides[key]=[...original];
  if(overrides[key][slotIdx])
    overrides[key][slotIdx]={...overrides[key][slotIdx],name:name+' '+abbr};
  else
    overrides[key][slotIdx]={order:slotIdx+1,pos:'x',name:name+' '+abbr,hand:'R'};

  // Re-render just that game card's lineup
  const gi=DATA.games.findIndex(x=>x.tab===tab);
  const gridEl=document.getElementById('gc-lu-grid-'+gi);
  if(gridEl) gridEl.innerHTML=renderLineupCol(g,'away')+renderLineupCol(g,'home');
  closePicker();
}
document.getElementById('picker-overlay').addEventListener('click',function(e){
  if(e.target===this) closePicker();
});

function setView(v,btn){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.getElementById('view-'+v).classList.add('on');
  btn.classList.add('on');
}
setInterval(load,30*60*1000);
</script>
</body>
</html>
