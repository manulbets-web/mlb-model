name: MLB Daily Refresh

on:
  schedule:
    - cron: '0 13 * * *'   # 9:00 AM ET
    - cron: '0 16 * * *'   # 12:00 PM ET
    - cron: '0 21 * * *'   # 5:00 PM ET
    - cron: '0 0 * * *'    # 8:00 PM ET
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Install system deps
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-v2

      - name: Install R packages
        run: |
          Rscript -e "
            pkgs <- c('googlesheets4','googledrive','httr','jsonlite',
                      'dplyr','purrr','tibble','stringr')
            miss <- pkgs[!pkgs %in% rownames(installed.packages())]
            if(length(miss)) install.packages(miss, repos='https://cloud.r-project.org')
          "

      - name: Write service account key
        env:
          GS_SERVICE_ACCOUNT_JSON: ${{ secrets.GS_SERVICE_ACCOUNT_JSON }}
        run: echo "$GS_SERVICE_ACCOUNT_JSON" > /tmp/sa_key.json

      - name: Run mlb_daily.R
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GS_SERVICE_ACCOUNT_JSON: ${{ secrets.GS_SERVICE_ACCOUNT_JSON }}
        run: Rscript mlb_daily.R

      - name: Run export_json.R
        env:
          GS_SERVICE_ACCOUNT_JSON: ${{ secrets.GS_SERVICE_ACCOUNT_JSON }}
        run: Rscript export_json.R

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "chore: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
